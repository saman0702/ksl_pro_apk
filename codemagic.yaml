# Codemagic — Katian Pro (ksl_pro_apk)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# À configurer dans Codemagic UI avant le 1er build :
# 1. Integrations → Apple Developer Portal → nommer la clé (ex. App Store Connect API key)
# 2. Remplacer APP_STORE_CONNECT_INTEGRATION et APP_STORE_APPLE_ID ci-dessous
# 3. Créer l'app dans App Store Connect (bundle id: com.katian.katianProCompagnietpApp)

workflows:
  ios-release:
    name: Katian Pro iOS (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Nom exact de la clé API dans Codemagic → Team → Integrations → Apple Developer Portal
      app_store_connect: APP_STORE_CONNECT_INTEGRATION

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.katian.katianProCompagnietpApp
      vars:
        # ID numérique App Store Connect → App → General → App Information → Apple ID
        APP_STORE_APPLE_ID: "0000000000"
        BUNDLE_ID: com.katian.katianProCompagnietpApp

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/ios/Pods

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: release/*
          include: true
          source: true

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Increment build number (TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEW_BUILD=$((LATEST + 1))
          echo "NEW_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"
          echo "Build number → $NEW_BUILD"

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-number="$NEW_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # Décommenter pour recevoir les mails de build :
      # email:
      #   recipients:
      #     - toi@exemple.com
      #   notify:
      #     success: true
      #     failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Décommenter et adapter les groupes TestFlight :
        # beta_groups:
        #   - Internal Testers
        submit_to_app_store: false
